<!DOCTYPE >
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="styles.css" />
        <title>Flashcard Quiz App</title>
    </head>
    <body>
        <main>
            <h1>Flashcard Quiz</h1>
            <div id="flashcard">
                <div id="question"></div>
                <div id="answer"></div>
            </div>
            <button id="delete-btn">Delete Card</button>

            <form id="entry-form">
                <textarea
                    id="front-text"
                    placeholder="Enter Question"
                ></textarea>

                <textarea id="back-text" placeholder="Enter answer"></textarea>

                <button type="submit">Add Flashcard</button>
            </form>
        </main>

        <script src="index.js"></script>
    </body>
</html>
